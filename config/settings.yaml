exchange:
  name: bybit
  testnet: true                    # переключи на false для live
  rate_limit_ms: 200

trading:
  timeframe: 4h
  direction: short                 # только шорты
  leverage: 1
  base_currency: USDT

# ══════════════════════════════════════════════════════════════════
# GLOBAL BLACKLIST — применяется ко ВСЕМ группам везде
# (collect / train / backtest / live bot)
# ══════════════════════════════════════════════════════════════════
global_exclude_symbols:
  - "USELESS/USDT:USDT"    # мем-монета без ликвидности
  - "PUMPFUN/USDT:USDT"    # экстремально волатильная мем-монета
  - "1000SHIB/USDT:USDT"   # дублирующий тикер SHIB
  - "SHIB1000/USDT:USDT"   # дублирующий тикер SHIB
  - "SHIB/USDT:USDT"       # нецелочисленный размер позиции
  - "PEPE/USDT:USDT"       # мем
  - "BONK/USDT:USDT"       # мем
  - "WIF/USDT:USDT"        # мем-монета (dogwifhat)
  - "BOME/USDT:USDT"       # мем
  - "FARTCOIN/USDT:USDT"   # мем
  - "PENGU/USDT:USDT"      # заблокировано пользователем
  - "TAO/USDT:USDT"        # заблокировано пользователем
  - "VIRTUAL/USDT:USDT"    # заблокировано пользователем

# ══════════════════════════════════════════════════════════════════
# SYMBOL UNIVERSE — переключай active_group для разных тестов
# ══════════════════════════════════════════════════════════════════
symbol_universe:
  active_group: "experimental"   # "main" | "experimental"

  groups:
    # Группа 1: автоматический отбор через объём → история → корреляция с BTC
    main:
      top_n: "all"                        # "all" или число, например 20
      min_volume_usdt: 5_000_000
      min_btc_correlation: 0.4            # минимальная корреляция с BTC
      history_days_required: 1095         # минимум 3 года истории
      exclude_symbols:
        - "ZEC/USDT:USDT"
        - "XRP/USDT:USDT"
        - "INJ/USDT:USDT"
        - "1000SHIB/USDT:USDT"
        - "SHIB1000/USDT:USDT"
        - "SHIB/USDT:USDT"
        - "AERO/USDT:USDT"
        - "DIA/USDT:USDT"
        - "MNT/USDT:USDT"
        - "NIL/USDT:USDT"
        - "PENGU/USDT:USDT"
        - "PUMPFUN/USDT:USDT"
        - "TAO/USDT:USDT"
        - "USELESS/USDT:USDT"
        - "VIRTUAL/USDT:USDT"

    # Группа 2: фиксированный список слабых монет (вручную отобранные)
    experimental:
      symbols:
        - "BTC/USDT:USDT"
        - "PUMPFUN/USDT:USDT"
        - "ONDO/USDT:USDT"
        - "ENA/USDT:USDT"
        - "WLD/USDT:USDT"
        - "TAO/USDT:USDT"
        - "FARTCOIN/USDT:USDT"
        - "NIL/USDT:USDT"
        - "PENGU/USDT:USDT"
        - "WIF/USDT:USDT"
        - "DIA/USDT:USDT"
        - "COTI/USDT:USDT"
        - "AERO/USDT:USDT"
        - "VIRTUAL/USDT:USDT"
        - "JTO/USDT:USDT"
        - "SEI/USDT:USDT"
        - "MNT/USDT:USDT"
        - "TIA/USDT:USDT"
        - "GALA/USDT:USDT"
        - "ERA/USDT:USDT"
        - "CRV/USDT:USDT"
        - "VANRY/USDT:USDT"
        - "JUP/USDT:USDT"
        - "BOME/USDT:USDT"
        - "PEOPLE/USDT:USDT"
        - "USELESS/USDT:USDT"
        - "STRK/USDT:USDT"
        - "RENDER/USDT:USDT"
        - "ETHFI/USDT:USDT"
        - "EIGEN/USDT:USDT"
        - "PYTH/USDT:USDT"

# ══════════════════════════════════════════════════════════════════
# EXIT MODE — переключай для сравнения стратегий выхода
# ══════════════════════════════════════════════════════════════════
exit_mode: "simple"   # "simple" | "partial_tp" | "trailing_only"

exit_params:
  # Простой выход: фиксированный TP и SL, без частичного закрытия
  simple:
    tp_atr_mult: 2.0
    sl_atr_mult: 1.5

  # Частичный TP: 50% закрываем по TP, остаток тащим с trailing SL (Chandelier Exit)
  partial_tp:
    tp_atr_mult: 2.0
    sl_atr_mult: 1.5
    partial_close_pct: 0.5     # доля позиции для закрытия по TP
    ce_atr_mult: 2.0           # множитель ATR для Chandelier Exit trailing stop

  # Только trailing: нет фиксированного TP, trailing SL с самого начала
  trailing_only:
    sl_atr_mult: 1.5           # начальный SL (защита если сразу пошло против)
    ce_atr_mult: 2.0           # множитель ATR для Chandelier Exit

labeling:
  atr_period: 14
  tp_atr_mult: 2.0                 # 2 ATR вниз = Take Profit (для разметки)
  sl_atr_mult: 1.5                 # 1.5 ATR вверх = Stop Loss (для разметки)
  max_bars: 20                     # таймаут через 20 × 4H = 80 часов
  min_rr: 1.3                      # минимальный R/R для метки "1"

model:
  type: lightgbm
  train_window_days: 180           # учим на последних 6 месяцах
  retrain_every_days: 7            # переучиваем каждую неделю
  min_samples: 500                 # минимум примеров для обучения
  min_confidence: 0.60             # порог уверенности для входа в шорт
  drift_check_last_n: 30
  drift_precision_threshold: 0.45
  sample_weight_halflife_days: 60

  lgbm_params:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8
    class_weight: balanced
    random_state: 42
    n_jobs: -1

risk:
  trade_size_usdt: 10.0            # Ровно $10 на каждую сделку
  max_open_positions: 9999         # ОГРАНИЧЕНИЕ СНЯТО
  max_drawdown_pct: 15.0           # стоп бота при -15% от пика
  atr_sl_mult: 1.5                 # стоп = 1.5 ATR от цены входа
  funding_blackout_minutes: 30     # не открывать за N мин до funding
  min_liquidity_spread: 0.001      # максимально допустимый спред

backtest:
  commission_taker: 0.00055        # 0.055% Bybit taker
  commission_maker: 0.00020        # 0.020% Bybit maker
  slippage: 0.0005                 # 0.05% slippage
  initial_capital: 1000            # стартовый капитал для бэктеста ($)

data:
  history_days: 1095               # 3 года истории для загрузки
  storage_dir: data/storage
  raw_dir: data/storage/raw
  processed_dir: data/storage/processed

features:
  # Multi-timeframe
  timeframes_extra: [1h, 1d]
  # Market breadth window
  breadth_rolling_corr_window: 30
  # VWMA periods (только 21 и 50 — 200 режет слишком много начала истории)
  vwma_periods: [21, 50]
  # Индикаторы
  atr_period: 14
  rsi_period: 14
  ema_periods: [21, 50, 200]
  bb_period: 20
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

logging:
  level: INFO
  file: logs/mltrading.log

telegram:
  enabled: false
  # token и chat_id задаются в .env

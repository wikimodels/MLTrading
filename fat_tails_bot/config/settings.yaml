# Fat Tails 4H Trading Bot Configuration
# Validated Grail Architecture (Chandelier + Donchian Compression + Trailing Exit)

symbol_universe:
  active_group: "main"
  groups:
    main:
      description: "Automatically screened Universe of top 20 trending coins"
      top_n: 20

data:
  raw_dir: "data/storage/raw"
  timeframe: "4h"
  history_days: 1095

exchange:
  rate_limit_ms: 50

strategy:
  # Quantitative screening thresholds
  screener_lookback_days: 180
  
  # Donchian Compression Filter
  donchian_period: 20
  donchian_threshold: 0.05
  donchian_percentile_window: 100
  
  # Chandelier Exit Trigger
  chandelier_period: 22
  chandelier_atr_mult: 3.0
  
  allow_short: true
  allow_long: true

risk:
  trade_size_usdt: 10.0   # Fixed $10 position size per trade
  max_leverage: 1
  trailing_atr_mult: 2.5  # Dynamic trailing exit from absolute extreme

backtest:
  initial_capital: 500.0
  maker_fee: 0.0015       # Taker/Taker simulation
  taker_fee: 0.0015
  slippage: 0.0000
  start_date: "2023-01-01"
  end_date: "2026-07-27"

global_exclude_symbols:
  - "BTC/USDT:USDT"
  - "ETH/USDT:USDT"
  - "USDC/USDT:USDT"
  - "BUSD/USDT:USDT"
  - "DAI/USDT:USDT"

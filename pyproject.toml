[project]
name = "mltrading"
version = "0.1.0"
description = "ML-powered swing short trading bot for Bybit"
authors = [
    {name = "Vitali"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "ccxt (>=4.5.68,<5.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "ta (>=0.11.0,<0.12.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "optuna (>=4.9.0,<5.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-telegram-bot (>=22.8,<23.0)",
    "fpdf2 (>=2.8.7,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
